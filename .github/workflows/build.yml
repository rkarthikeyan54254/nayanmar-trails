name: Build verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify:data
      - run: npm run build

      - name: Capture desktop visual QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/nayanmar-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          BROWSER="$(which google-chrome || which chromium || which chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No headless browser available"
            exit 1
          fi

          capture_at() {
            local name="$1"
            local url="$2"
            local viewport="$3"
            timeout 45s "$BROWSER" \
              --headless \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=12000 \
              --window-size="$viewport" \
              --screenshot="artifacts/$name.png" \
              "$url"
            test -s "artifacts/$name.png"
          }

          capture() {
            capture_at "$1" "$2" "1600,1050"
          }

          capture "appar-mapped-playback" "http://127.0.0.1:4173/?saint=nayanmar.20"
          capture "appar-kanchipuram-position" "http://127.0.0.1:4173/?saint=nayanmar.20&site=TO01"
          capture "appar-connections-modal" "http://127.0.0.1:4173/?saint=nayanmar.20&graph=1"
          capture "appar-sthalam-overview" "http://127.0.0.1:4173/?saint=nayanmar.20&site=TO20"
          capture "appar-native-ta" "http://127.0.0.1:4173/?saint=nayanmar.20&lang=ta"
          capture_at "tamil-header-wide" "http://127.0.0.1:4173/?saint=nayanmar.20&lang=ta" "2048,700"
          capture_at "tamil-header-laptop" "http://127.0.0.1:4173/?saint=nayanmar.20&lang=ta" "1366,850"
          capture_at "mobile-400-en" "http://127.0.0.1:4173/?saint=nayanmar.20&lang=en" "400,850"
          capture_at "mobile-400-ta" "http://127.0.0.1:4173/?saint=nayanmar.20&lang=ta" "400,850"
          capture_at "mobile-375-en" "http://127.0.0.1:4173/?saint=nayanmar.09&lang=en" "375,812"
          capture_at "mobile-375-ta" "http://127.0.0.1:4173/?saint=nayanmar.09&lang=ta" "375,812"
          capture "appar-sthalam-overview-ta" "http://127.0.0.1:4173/?saint=nayanmar.20&site=TO20&lang=ta"
          capture "appar-thevaram-panel" "http://127.0.0.1:4173/?saint=nayanmar.20&site=TO20&tab=hymns"
          capture "sources-methodology" "http://127.0.0.1:4173/?sources=1"
          capture "sources-methodology-ta" "http://127.0.0.1:4173/?sources=1&lang=ta"
          capture "nayanmar-tradition-fallback" "http://127.0.0.1:4173/?saint=nayanmar.01"
          capture "manikkavasakar-naalvar" "http://127.0.0.1:4173/?saint=tirumurai8.manikkavacakar"
          capture "manikkavasakar-uttarakosamangai-context" "http://127.0.0.1:4173/?saint=tirumurai8.manikkavacakar&tab=chronology"
          capture "manikkavasakar-uttarakosamangai-context-ta" "http://127.0.0.1:4173/?saint=tirumurai8.manikkavacakar&tab=chronology&lang=ta"
          capture "sambandar-vedaranyam-kolaru-context" "http://127.0.0.1:4173/?saint=nayanmar.27&site=KT125&tab=visits"
          capture "sambandar-vedaranyam-kolaru-context-ta" "http://127.0.0.1:4173/?saint=nayanmar.27&site=KT125&tab=visits&lang=ta"
          capture "kannappar-story-en" "http://127.0.0.1:4173/?saint=nayanmar.09&lang=en"
          capture "kannappar-story-ta" "http://127.0.0.1:4173/?saint=nayanmar.09&lang=ta"

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nayanmar-visual-qa
          path: artifacts/*.png
          if-no-files-found: error
